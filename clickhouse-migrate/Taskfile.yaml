version: '3'

tasks:
  build:
    desc: Build the clickhouse-migrate binary
    cmds:
      - CGO_ENABLED=0 go build -o bin/clickhouse-migrate .

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint (assumes it's installed on PATH -- see CI's pinned version)
    cmds:
      - golangci-lint run
