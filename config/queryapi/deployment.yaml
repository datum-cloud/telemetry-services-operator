apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryapi
  labels:
    app.kubernetes.io/name: queryapi
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queryapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queryapi
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: queryapi
          image: ghcr.io/milo-os/o11y/queryapi:latest
          args:
            # Synthetic logs until the ClickHouse backend can query. Switch to
            # --storage=clickhouse and supply CLICKHOUSE_* env plus a client
            # certificate volume once it can.
            - --storage=fake
            - --addr=:8080
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
