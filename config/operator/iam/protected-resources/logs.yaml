# The log query surface queryapi serves. These are not CRDs: nothing stores a
# Log object, and the permissions below gate the Loki-shaped routes in
# queryapi/routes.go. See queryapi/docs/authorization.md.
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: o11y.miloapis.com-logs
spec:
  serviceRef:
    name: "o11y.miloapis.com"
  kind: Log
  plural: logs
  singular: log
  permissions:
    # query returns log lines; the get* actions return only metadata about
    # them. Label values in particular carry pod names, hostnames and customer
    # identifiers, which is a boundary that cannot be drawn later without
    # migrating every policy that granted a coarser permission.
    - query
    - getLabels
    - getSeries
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
