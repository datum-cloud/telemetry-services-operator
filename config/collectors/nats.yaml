# Standalone core NATS server (no local JetStream). gateway-collector and
# node-agent-collector publish logs here directly via the nats exporter.
# Edge PoPs have no local persistent storage, so this runs core NATS
# pub/sub only -- no stream, no durability at this hop. It makes a leaf
# connection (NATS_HUB_LEAFNODE_URL) to a real, storage-backed hub for
# durability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    server_name: edge-nats
    listen: 0.0.0.0:4222
    tls {
      cert_file: "/etc/nats-server-tls/tls.crt"
      key_file: "/etc/nats-server-tls/tls.key"
      ca_file: "/etc/nats-server-tls/ca.crt"
      verify: true
    }
    http_port: 8222
    leafnodes {
      remotes: [
        {
          url: $NATS_HUB_LEAFNODE_URL
          # The hub's leafnode listener serves LetsEncrypt TLS and
          # authenticates this leaf by NKey -- it does NOT request a client
          # certificate. So the edge presents only its per-PoP NKey seed and
          # trusts the hub's cert against the public LE chain.
          nkey: $EDGE_NKEY_SEED
          tls: {
            handshake_first: true
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7777"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: metrics
          image: natsio/prometheus-nats-exporter:v0.20.1
          args:
            - -varz
            - -connz
            - -subz
            - -addr=0.0.0.0
            - -port=7777
            - http://localhost:8222
          ports:
            - name: metrics
              containerPort: 7777
        - name: nats
          image: nats:2.14.2-alpine
          command: ["nats-server", "-c", "/etc/nats/nats.conf"]
          env:
            - name: NATS_HUB_LEAFNODE_URL
              value: "${hub_leafnode_url}"
            - name: EDGE_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  # Per-PoP NKey seed, pulled from GCP Secret Manager by the
                  # edge o11y app (ExternalSecret nats-leaf-nkey-<cluster>).
                  name: edge-leaf-nkey
                  key: edge.seed
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: nats-server-tls
              mountPath: /etc/nats-server-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: nats-config
        # Server cert for the edge-local client port, issued by the o11y-system
        # ClusterIssuer via the cert-manager CSI driver. The edge app-sync
        # patches PLACEHOLDER-issuer to the real ClusterIssuer. verify: true in
        # nats.conf means collectors must present a client cert signed by the
        # same CA (provided by the CSI-based nats-client-certs volume on each
        # collector) -- intra-cluster mTLS, mirroring the hub sink pattern.
        - name: nats-server-tls
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: PLACEHOLDER-issuer
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: edge-nats-server
              csi.cert-manager.io/duration: "2160h"
              csi.cert-manager.io/renew-before: "360h"
              csi.cert-manager.io/key-usages: "server auth"
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitoring
      port: 8222
      targetPort: 8222
    - name: metrics
      port: 7777
      targetPort: 7777
